steps:
  # ── api service ──────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=SERVICE=api
      - -t=asia-south1-docker.pkg.dev/$PROJECT_ID/news-bot-repo/news-bot-api:$_COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args: [push, asia-south1-docker.pkg.dev/$PROJECT_ID/news-bot-repo/news-bot-api:$_COMMIT_SHA]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - news-bot-api
      - --image=asia-south1-docker.pkg.dev/$PROJECT_ID/news-bot-repo/news-bot-api:$_COMMIT_SHA
      - --region=asia-south1
      - --service-account=news-bot-api-sa@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,VERTEX_AI_LOCATION=asia-south1,APP_ENV=prod
      - --set-secrets=TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,WEBHOOK_SECRET_TOKEN=webhook-secret-token:latest,ADMIN_TELEGRAM_ID=admin-telegram-id:latest,LOG_PSEUDONYM_SALT=log-pseudonym-salt:latest
      - --allow-unauthenticated
      - --memory=512Mi
      - --max-instances=1

  # ── worker service ────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=SERVICE=worker
      - -t=asia-south1-docker.pkg.dev/$PROJECT_ID/news-bot-repo/news-bot-worker:$_COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args: [push, asia-south1-docker.pkg.dev/$PROJECT_ID/news-bot-repo/news-bot-worker:$_COMMIT_SHA]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - news-bot-worker
      - --image=asia-south1-docker.pkg.dev/$PROJECT_ID/news-bot-repo/news-bot-worker:$_COMMIT_SHA
      - --region=asia-south1
      - --service-account=news-bot-worker-sa@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,VERTEX_AI_LOCATION=asia-south1,APP_ENV=prod,GOOGLE_GENAI_USE_VERTEXAI=1,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=asia-south1
      - --set-secrets=TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,NEWSDATA_API_KEY=NEWSDATA_API_KEY:latest,LOG_PSEUDONYM_SALT=log-pseudonym-salt:latest
      - --no-allow-unauthenticated
      - --memory=1Gi
      - --max-instances=2
      - --timeout=1800
      - --concurrency=1

substitutions:
  _COMMIT_SHA: manual

options:
  logging: CLOUD_LOGGING_ONLY
